<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>방향키 입력 게임</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background-color: #1a1a1a; 
      margin: 0;
    }
    #game-card {
      background: #fff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 25px rgba(0,0,0,0.8);
      text-align: center;
      width: 700px; /* 3칸짜리 망곰이가 나올 수 있으므로 넉넉하게 */
    }
    .arrow-container {
      display: flex;
      justify-content: center;
      flex-wrap: nowrap; 
      overflow-x: visible; 
      gap: 8px;
      margin: 20px 0;
      font-size: 2rem;
      min-height: 50px;
    }
    
    .arrow {
      flex-shrink: 0; 
      width: 40px; 
      height: 40px;
      line-height: 40px;
      border: 2px solid #ccc;
      border-radius: 8px;
      font-family: "Arial Black", "Impact", sans-serif;
      font-weight: 900; 
      color: #0033cc; 
      
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    /* --- 망곰이(스페이스바) 전용 스타일 --- */
    .arrow.space-key {
      background-color: #fff; /* 요청하신 흰색 배경 */
      overflow: hidden;
      padding: 0; 
      /* 망곰이 여러 마리가 가로로 예쁘게 나열되도록 설정 */
      justify-content: flex-start;
      gap: 8px; 
    }
    /* 망곰이 이미지 개별 스타일 */
    .arrow.space-key img {
      width: 40px;
      height: 40px;
      object-fit: cover;
      border-radius: 6px;
    }
    
    .arrow.bg-up { background-color: #e3f2fd; } 
    .arrow.bg-down { background-color: #ffebee; } 
    .arrow.bg-left { background-color: #e8f5e9; } 
    .arrow.bg-right { background-color: #f3e5f5; } 

    /* 입력 성공 시 처리 (초록색 테두리와 배경) */
    .arrow.correct {
      background-color: #4caf50 !important;
      color: white !important;
      border-color: #4caf50 !important;
    }
    
    #timer-container {
      width: 100%;
      height: 20px;
      background: #eee;
      border-radius: 10px;
      margin: 15px 0;
      overflow: hidden;
      border: 1px solid #ccc;
    }
    #timer-bar {
      width: 100%;
      height: 100%;
      background: #4caf50;
      transition: width 0.02s linear, background 0.2s ease;
    }
    
    #message {
      font-size: 1.1rem;
      font-weight: bold;
      min-height: 50px; 
      margin: 10px 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      color: #333;
    }
    
    #restart-btn {
      display: none;
      margin-top: 10px;
      padding: 10px 20px;
      font-size: 1rem;
      font-weight: bold;
      background-color: #ff9800;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    #restart-btn:hover {
      background-color: #e68a00;
    }
    
    #stage-info {
      font-size: 1.2rem;
      font-weight: bold;
      margin: 0;
      color: #333;
    }
  </style>
</head>
<body>

<div id="game-card">
  <p id="stage-info">스테이지: <span id="stage">1</span></p>
  
  <div id="timer-container">
    <div id="timer-bar"></div>
  </div>
  
  <div class="arrow-container" id="arrow-box"></div>
  <div id="message">방향키(또는 스페이스바)를 눌러 시작하세요!</div>
  
  <button id="restart-btn" onclick="startGame()">다시 시작하기</button>
</div>

<script>
  const validKeys = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '];
  
  const arrowSymbols = {
    'ArrowUp': '⬆',
    'ArrowDown': '⬇',
    'ArrowLeft': '⬅',
    'ArrowRight': '➡'
  };

  let currentStage = 1;
  let targetPattern = []; // 이제 객체 배열을 저장합니다: { key: 'ArrowUp', size: 1 }
  let currentIndex = 0;
  
  let timerInterval;
  let maxTime = 5; 
  let timeLeft = 5;
  let isGameOver = false;

  function startGame() {
    currentStage = 1;
    isGameOver = false;
    document.getElementById('restart-btn').style.display = 'none';
    document.getElementById('stage').innerText = currentStage;
    nextStageSetup();
  }

  function nextStageSetup() {
    let length = Math.min(4 + currentStage, 10);
    
    maxTime = Math.max(5 - (currentStage - 1) * 0.5, 2.4);
    timeLeft = maxTime;
    
    generatePattern(length);
    document.getElementById('message').innerHTML = "제한시간 내에 입력하세요!";
    document.getElementById('message').style.color = "#333";
    
    startTimer();
  }

  function startTimer() {
    clearInterval(timerInterval);
    const timerBar = document.getElementById('timer-bar');
    
    timerInterval = setInterval(() => {
      timeLeft -= 0.02; 
      
      let widthPercentage = (timeLeft / maxTime) * 100;
      timerBar.style.width = widthPercentage + "%";
      
      if (widthPercentage > 50) timerBar.style.background = "#4caf50";
      else if (widthPercentage > 20) timerBar.style.background = "#ff9800";
      else timerBar.style.background = "#f44336";

      if (timeLeft <= 0) {
        gameOver("시간 초과!");
      }
    }, 20);
  }

  function gameOver(msg) {
    isGameOver = true;
    clearInterval(timerInterval);
    document.getElementById('message').innerHTML = `<span>❌ ${msg}</span><span>최종 도달 스테이지: <strong>${currentStage}</strong></span>`;
    document.getElementById('message').style.color = "#f44336";
    document.getElementById('restart-btn').style.display = 'inline-block';
  }

  function generatePattern(length) {
    targetPattern = [];
    for (let i = 0; i < length; i++) {
      const key = validKeys[Math.floor(Math.random() * validKeys.length)];
      
      // 스페이스바가 당첨되면 1~3칸 중 랜덤으로 사이즈 지정
      if (key === ' ') {
        const randomSize = Math.floor(Math.random() * 3) + 1; // 1, 2, or 3
        targetPattern.push({ key: key, size: randomSize });
      } else {
        // 일반 방향키는 무조건 1칸
        targetPattern.push({ key: key, size: 1 });
      }
    }
    currentIndex = 0;
    renderArrows();
  }

  function renderArrows() {
    const box = document.getElementById('arrow-box');
    box.innerHTML = '';
    
    targetPattern.forEach((item, index) => {
      const span = document.createElement('div');
      span.className = 'arrow';
      
      if (item.key === 'ArrowUp') span.classList.add('bg-up');
      if (item.key === 'ArrowDown') span.classList.add('bg-down');
      if (item.key === 'ArrowLeft') span.classList.add('bg-left');
      if (item.key === 'ArrowRight') span.classList.add('bg-right');
      
      if (item.key === ' ') {
        span.classList.add('space-key');
        // 사이즈(칸 수)에 맞춰 가로 너비 동적 계산 (칸당 40px + 칸 사이 여백 8px)
        span.style.width = `${(item.size * 40) + ((item.size - 1) * 8)}px`;
      }
      
      if (index < currentIndex) {
        span.classList.add('correct');
      }

      if (item.key === ' ') {
        // 칸 수(size)만큼 망곰이 이미지를 반복해서 넣어줍니다.
        let imagesHtml = '';
        for(let i = 0; i < item.size; i++) {
          imagesHtml += `<img src="망곰이.png" alt="SPACE">`;
        }
        span.innerHTML = imagesHtml;
      } else {
        span.innerText = arrowSymbols[item.key];
      }
      
      box.appendChild(span);
    });
  }

  window.addEventListener('keydown', (e) => {
    if (isGameOver) return;
    
    if (!validKeys.includes(e.key)) return;

    e.preventDefault();

    // targetPattern이 객체 배열로 바뀌었으므로 .key로 값을 꺼내어 비교합니다
    if (e.key === targetPattern[currentIndex].key) {
      currentIndex++;
      renderArrows();

      if (currentIndex === targetPattern.length) {
        clearInterval(timerInterval); 
        currentStage++;
        document.getElementById('stage').innerText = currentStage;
        document.getElementById('message').innerHTML = "CLEAR!";
        document.getElementById('message').style.color = "#4caf50";
        
        setTimeout(() => {
          if(!isGameOver) nextStageSetup();
        }, 150); 
      }
    } else {
      gameOver("잘못된 키를 눌렀습니다!");
    }
  });

  startGame();
</script>

</body>
</html>
